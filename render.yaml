# Render Blueprint (Render dashboard > New > Blueprint > pick this repository).
# Creates the AklatOne API (Docker, from backend/Dockerfile) and a private MariaDB 10.11 with its own disk.
# Persistent disks need a paid instance type ("starter" or higher); the free type sleeps and loses disk data.
# After the first deploy:
#   1. Open aklatone-db > Environment, copy MARIADB_PASSWORD.
#   2. Open aklatone-api > Environment, set
#        DATABASE_URL = mysql://aklatone:<that password>@aklatone-db:3306/aklatone
#        CORS_ORIGINS = https://<your Staff Web address, e.g. the Vercel URL>
#        EMAIL_USER / EMAIL_PASS = the Gmail address and its app password
#      then Manual Deploy. Migrations run automatically on every start.
# The Staff Web can be hosted on Vercel (frontend/vercel.json) with VITE_API_BASE_URL = https://<aklatone-api URL>.
services:
  - type: web
    name: aklatone-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
    disk:
      name: aklatone-backups
      mountPath: /app/backups
      sizeGB: 1

  - type: pserv
    name: aklatone-db
    runtime: image
    image:
      url: docker.io/library/mariadb:10.11
    plan: starter
    envVars:
      - key: MARIADB_DATABASE
        value: aklatone
      - key: MARIADB_USER
        value: aklatone
      - key: MARIADB_PASSWORD
        generateValue: true
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true
    disk:
      name: aklatone-mariadb
      mountPath: /var/lib/mysql
      sizeGB: 5
