# Included in every location of nginx.conf: nginx drops server-level add_header lines in a location that has its own.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# CSP: only this site's scripts; inline styles are needed for React style attributes. Covers come from Open Library
# (which redirects to archive.org).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://covers.openlibrary.org https://*.archive.org; connect-src 'self' https://openlibrary.org https://covers.openlibrary.org; frame-src 'none'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
