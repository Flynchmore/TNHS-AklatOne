# Staff Web + reverse proxy to the AklatOne API (container "api" in docker-compose.yml).
server {
  listen 80;
  server_name _;
  server_tokens off;   # do not reveal the nginx version
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;

  include /etc/nginx/security-headers.conf;

  # Backup files can be large; restores take longer than normal requests.
  location /api/v1/backup/ { client_max_body_size 200m; proxy_read_timeout 300s; proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /health { proxy_pass http://api:3000; }

  # Mobile app download (Printing > Mobile app QR): put the signed release APK in ./downloads on the server.
  location /download/ {
    include /etc/nginx/security-headers.conf;
    types { application/vnd.android.package-archive apk; }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Long cache for fingerprinted build files, none for index.html so updates show at once.
  location /assets/ { include /etc/nginx/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
