# Release builds: push a tag such as v1.0.0 (git tag v1.0.0 && git push origin v1.0.0).
# Produces the signed Android APK + App Bundle and the Desktop installers, then attaches them to a GitHub Release.
#
# Repository settings > Secrets and variables > Actions:
#   Variable API_BASE_URL               https://library.example.com  (the school server; must be HTTPS)
#   Secret   ANDROID_KEYSTORE_BASE64    base64 of ~/aklatone-keys/aklatone-release.jks  (base64 -w0 aklatone-release.jks)
#   Secret   ANDROID_KEYSTORE_PASSWORD  storePassword from ~/aklatone-keys/keystore.properties
#   Secret   ANDROID_KEY_PASSWORD       keyPassword from the same file (alias is "aklatone")
#   Secret   WINDOWS_CERT_PFX_BASE64    optional: code-signing certificate (.pfx) as base64; unsigned without it
#   Secret   WINDOWS_CERT_PASSWORD      optional: password of that .pfx
# iOS is not built here: it needs an Apple Developer account and signing on a Mac (docs/COMPATIBILITY.md).
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Server address must be HTTPS (release phones refuse plain HTTP)
        run: |
          case "${{ vars.API_BASE_URL }}" in https://*) echo "API: ${{ vars.API_BASE_URL }}";; *) echo "Set the API_BASE_URL variable to https://..."; exit 1;; esac

  android:
    needs: check
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Restore the release keystore
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aklatone-release.jks"
      - name: Signed APK and App Bundle
        working-directory: frontend/mobile-capacitor/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/aklatone-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: aklatone
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/AklatOne-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/AklatOne-${GITHUB_REF_NAME}.aab"
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out/* }

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-22.04, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: frontend, shell: bash } }
    env:
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the WebView
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: npm ci
      - name: Windows code-signing certificate (optional)
        if: runner.os == 'Windows'
        id: cert
        shell: pwsh
        env: { PFX_B64: "${{ secrets.WINDOWS_CERT_PFX_BASE64 }}", PFX_PASSWORD: "${{ secrets.WINDOWS_CERT_PASSWORD }}" }
        run: |
          if (-not $env:PFX_B64) { Write-Output "No certificate: the installer will be unsigned."; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP "aklatone.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_B64))
          $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build installers
        env: { THUMBPRINT: "${{ steps.cert.outputs.thumbprint }}" }
        run: |
          if [ -n "$THUMBPRINT" ]; then
            npx tauri build --config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}"
          else
            npx tauri build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            frontend/desktop-tauri/target/release/bundle/msi/*.msi
            frontend/desktop-tauri/target/release/bundle/nsis/*.exe
            frontend/desktop-tauri/target/release/bundle/deb/*.deb
            frontend/desktop-tauri/target/release/bundle/rpm/*.rpm
            frontend/desktop-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: GitHub Release with every installer
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "AklatOne $GITHUB_REF_NAME" --generate-notes
