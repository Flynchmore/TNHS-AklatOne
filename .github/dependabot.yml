# Weekly update pull requests. Small (minor / patch) updates of one part come together in ONE pull request;
# merge it when the CI checks are green. Major versions still come one by one: read their notes first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /frontend/desktop-tauri
    schedule: { interval: weekly }
    groups:
      desktop-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      # Only even-numbered Node.js releases become LTS (long-term support); skip the short-lived odd ones.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
